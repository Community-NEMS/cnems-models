# config notes:
# Jacobi over the Magic HSM test model and C-NGMM.  Magic HSM sends every domestic gas region,
# so [natural_gas] takes no region_filter.

[common]
mode = "integrated jacobi"

# Modules to run (requires module input sections below)
models_to_run=['natural_gas', 'magic_hsm']

common_data_path='input/electricity/properties'
residential_data_path='input/residential'
output_path='output'
scenario_name = "jacobi_magic_hsm_ng"

# Temporal resolution (inter-annual); Magic HSM and C-NGMM do not read it
temporal_resolution = "default"

# Temporal resolution (annual):  the years of both models
aggregate_years=false
aggregate_start_year = 2023
summary_years = [2025, 2030, 2035, 2040, 2045, 2050]

strict_validation=false

[natural_gas]
input_path = 'input/natural_gas'

[magic_hsm]
# C-NGMM's inputs, for its regions and Q0; the folder [natural_gas] reads
ng_input_path = 'input/natural_gas'
# capacity = Q0 x (hub price / reference_price) ^ price_elasticity, elasticity in [0, 1]
price_elasticity = 0.5
# near C-NGMM's standalone hub price, USD/MMBtu of reference_dollar_year, which must be
# PRICE_DOLLAR_YEAR in src/models/natural_gas/constants.py
reference_price = 3.0
reference_dollar_year = 2025
