<svg width="100%" viewBox="0 0 1210 810" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Subdued energy technology background pattern</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A repeating pattern of radiating energy waves and interconnected nodes in muted teal and amber on charcoal felt, designed as a sophisticated background for plot titles</desc>
<defs>
<pattern id="energyWaves" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse">
<circle cx="75" cy="75" r="50" fill="none" stroke="#2a7a8f" stroke-width="1" opacity="0.4"/>
<circle cx="75" cy="75" r="37.5" fill="none" stroke="#2a7a8f" stroke-width="0.8" opacity="0.5"/>
<circle cx="75" cy="75" r="25" fill="none" stroke="#3a94b0" stroke-width="1.2" opacity="0.6"/>
<circle cx="75" cy="75" r="12.5" fill="none" stroke="#4aaccc" stroke-width="1.2" opacity="0.7"/>
<circle cx="75" cy="75" r="2.5" fill="#4aaccc" opacity="0.8"/>
</pattern>
<pattern id="nodeGrid" x="0" y="0" width="125" height="125" patternUnits="userSpaceOnUse">
<circle cx="62.5" cy="62.5" r="4" fill="#8b6f47" opacity="0.5"/>
<line x1="62.5" y1="62.5" x2="125" y2="62.5" stroke="#8b6f47" stroke-width="0.4" opacity="0.3"/>
<line x1="62.5" y1="62.5" x2="62.5" y2="125" stroke="#8b6f47" stroke-width="0.4" opacity="0.3"/>
</pattern>
</defs>
<rect width="1200" height="800" fill="#5e5e5b" style="fill:rgb(94, 94, 91);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect width="1200" height="800" fill="url(#energyWaves)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect width="1200" height="800" fill="url(#nodeGrid)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<defs>
<linearGradient id="energyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#3a94b0;stop-opacity:0.08"/>
<stop offset="50%" style="stop-color:#2a7a8f;stop-opacity:0.03"/>
<stop offset="100%" style="stop-color:#5e5e5b;stop-opacity:0"/>
</linearGradient>
</defs>
<rect width="1200" height="800" fill="url(#energyGlow)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<g opacity="0.2" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.2;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
<circle cx="200" cy="150" r="120" fill="none" stroke="#5a94b0" stroke-width="1" style="fill:none;stroke:rgb(90, 148, 176);color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<circle cx="1000" cy="650" r="150" fill="none" stroke="#8b7a5a" stroke-width="1" style="fill:none;stroke:rgb(139, 122, 90);color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<circle cx="600" cy="400" r="180" fill="none" stroke="#4aaccc" stroke-width="1" style="fill:none;stroke:rgb(74, 172, 204);color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</g>
</svg>
