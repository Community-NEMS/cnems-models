# Test copy of run_configs/basic_hsm_config.toml.  Kept separate so that the results pinned
# in tests/hsm/expected/ are insulated from edits to the run scenarios.
[common]
mode = "standalone"

# Modules to run (requires module input sections below)
models_to_run=['hsm']

common_data_path='input/common'  # currently unused
residential_data_path='input/residential'
output_path='output'
scenario_name = "hsm_baseline"

# C-HSM is annual and always runs every year from 2023 to 2050 (set in input/hsm/setup.csv).
# The temporal settings below are required by [common] but C-HSM does not read them.
temporal_resolution = "default"
aggregate_years=false
aggregate_start_year = 2023
summary_years = [2025, 2030, 2035, 2040, 2045, 2050]


[hsm]

input_path = 'input/hsm'
ng_input_path = 'input/natural_gas'
henry_hub_file = 'henry_hub_path_aeo2026_1987usd.csv'
