#[build-system]
#build-backend = "hatchling.build"
#requires = ["hatch-vcs>=0.5", "hatchling>=1.31"]

[project]
# Not published to PyPI or conda-forge -- installed locally via pixi only -- so this
# doesn't need the "catalystcoop." namespace prefix that public packages use to avoid
# collisions on the index.
name = "cnems_models"
description = "Models for Community NEMS project."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "CNEMS team", email = "tbd" }]
requires-python = ">=3.14,<3.15"
version = "0.1"
#dynamic = ["version"]
#license = { file = "LICENSE" }
# Intentionally empty: this package is never installed outside of the pixi
# environment defined below, so runtime dependencies are tracked once, as conda
# packages, under [tool.pixi.dependencies] rather than here too.
dependencies = []


[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C",   # Limit cyclomatic complexity using mccabe
  "D",   # pydocstyle errors
  "E",   # pycodestyle errors
  "EXE", # executable file issues
  "F",   # pyflakes
  "I",   # isort
  "ICN", # flake8 import conventions
#  "N",   # pep8-naming
  "NPY", # NumPy specific checks
  "PD",  # pandas checks
#  "PGH", # pygrep-hooks
#  "PIE", # flake8-pie miscellaneous linting
  "PTH", # use pathlib
#  "Q",   # flake8-quotes
#  "RET", # check return values
#  "RSE", # unnecessary parenthises on raised exceptions
#  "S",   # flake8-bandit
#  "SIM", # flake8-simplify
#  "UP",  # pyupgrade (use modern python syntax)
#  "W",   # pycodestyle warnings
]
ignore = [
  "D401",   # Require imperative mood in docstrings.
  "D417",

  "PD010",  # Use of df.pivot() / df.unstack()
  "PD013",  # Use of df.stack()
  "PD015",  # Use of pd.merge() rather than df.merge()
#  "RET504", # Ignore unnecessary assignment before return
#  "S101",   # Use of assert
]

[tool.ruff.lint.isort]
#known-first-party = ["cnems_inputs"]
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyrefly]
# Limited to "src" so the pre-commit hook -- which only installs pyrefly itself, not
# the rest of the dependencies -- can still resolve imports.
project-includes = ["src"]
python-version = "3.14"
# Resolve imports against whichever `python` is first on PATH, which inside `pixi run` is
# the pixi env. Without this pyrefly falls back to an arbitrary interpreter found on the
# machine and reports spurious missing-import errors for pyomo/pandas/etc. A literal path
# to .pixi/envs/default/bin/python would be wrong on win-64, which this workspace targets.
fallback-python-interpreter-name = "python"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"  # for pytest-xdist usage.  Comment out if not desired or if x-talk is suspected.
log_file = "tests/logs/testlog.log"
log_file_level = "INFO"

[tool.coverage.report]
precision = 2
sort = "miss"
skip_empty = true
#fail_under = 90
# fail_under is enforced once, after unit and integration coverage are combined, by
# the final "coverage report" invocation in the `test` pixi task below -- not here,
# since pytest-cov would otherwise also enforce it after unit or integration tests
# run on their own, before the other suite gets a chance to contribute its coverage.
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Don't complain if non-runnable code isn't run:
  "if __name__ == .__main__.:",

  # Stuff that's not expected to run normally...
  "logger.debug",
]

# these settings are for the linter which Pylance uses
# in VS Code.  Suppressing these avoids many warnings in pyomo-based code
# as pyomo isn't fully "typed", but still catches many others--a compromise.
[tool.pyright]
reportCallIssue = false
# reportArgumentType = false
reportOperatorIssue = false
reportOptionalMemberAccess = false
reportSelfClsParameterName = false
reportOptionalSubscript = false

[tool.pixi.workspace]
channels = ["conda-forge"] #, "bioconda"]
platforms = ["linux-aarch64", "osx-arm64", "linux-64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
# Install this package itself in editable mode. No extras yet -- optional-dependency
# groups get added here as later PRs bring over the systems that need them (tests,
# lint, type checking, docs).
# TODO:  come back to this relationship...
#"cnems_inputs" = { path = ".", editable = true }


[tool.pixi.dependencies]
pyomo = '*'
numpy = '>=2.0'
highspy = '*'
ruff = '*'
pytest = '*'
pytest-xdist = '*'
pydantic = '*'
pandas = '*'
matplotlib = '*'
dash = '*'
dash-bootstrap-components = '*'
networkx = '*'
tabulate = '*'

# Tooling invoked by the [tool.pixi.tasks] below.  Each entry is required by at least
# one task, so dropping one breaks that task rather than merely slimming the env.
coverage = '*'    # test-erase, test
pytest-cov = '*'  # test-runner
pyrefly = '*'     # lint-pyrefly
prettier = '*'    # format-yaml
prek = '*'        # prek-update
pixi-pycharm = ">=0.0.12,<0.0.13"


[tool.pixi.tasks]
test-erase = { cmd = "coverage erase", description = "Wipe previously recorded coverage data before the test suites run." }
#test-unit = { cmd = "pytest --cov=cnems_inputs --cov-append --cov-report=xml --cov-fail-under=0 --doctest-modules src/cnems_inputs tests/unit", depends-on = [
#  "test-erase",
#], description = "Run unit tests (and doctests) with coverage instrumentation." }
#test-integration = { cmd = "pytest --cov=cnems_inputs --cov-append --cov-report=xml --cov-fail-under=0 tests/integration", depends-on = [
#  "test-erase",
#], description = "Run integration tests with coverage instrumentation." }
#test = { cmd = "coverage report --sort=cover", depends-on = [
#  "test-unit",
#  "test-integration",
#], description = "Run all tests and report combined coverage, failing if it's below the configured threshold." }
test-runner = {cmd="pytest --cov=src --cov-append --cov-report=xml --cov-fail-under=0", depends-on = ["test-erase"]}
test = {cmd="coverage report --sort=cover", depends-on=["test-runner"]}

lint-ruff = { cmd = "ruff check .", description = "Check code style and correctness with ruff, without modifying files." }
lint-pyrefly = { cmd = "pyrefly check src", description = "Type check the code with pyrefly." }
lint = { depends-on = [
  "lint-ruff",
  "lint-pyrefly",
], description = "Run all linters and type checks, without modifying files." }

format-ruff = { cmd = "ruff format . && ruff check --fix .", description = "Reformat code and auto-fix lint issues with ruff." }
#format-toml = { cmd = "taplo fmt pyproject.toml zensical.toml", description = "Reformat TOML files with taplo." }
# TODO:  Exclude "docs" below for now...
#format-md = { cmd = "mdformat README.md AGENTS.md .github/ISSUE_TEMPLATE .github/pull_request_template.md", description = "Reformat Markdown files with mdformat." }
format-yaml = { cmd = "prettier --write '**/*.{yaml,yml}'", description = "Reformat YAML files with prettier." }
format = { depends-on = [
  "format-ruff",
  "format-yaml",
], description = "Run all formatters, modifying files in place." }

#docs = { cmd = "zensical build", description = "Build the documentation with Zensical into site/." }
#docs-serve = { cmd = "zensical serve", description = "Serve the documentation locally, rebuilding on changes." }

prek-update = { cmd = "prek update", description = "Bump the `rev` pins in .pre-commit-config.yaml to their latest tagged versions. Used by .github/workflows/update-lockfiles.yml; see also `pixi update` for refreshing pixi.lock itself." }
