# config notes:
# Jacobi over the C-HSM sample model and C-NGMM.  C-HSM sends every domestic gas region, so
# [natural_gas] takes no region_filter.

[common]
mode = "integrated jacobi"

# Modules to run (requires module input sections below)
models_to_run=['natural_gas', 'hsm']

common_data_path='input/electricity/properties'
residential_data_path='input/residential'
output_path='output'
scenario_name = "jacobi_hsm_ng"

# Temporal resolution (inter-annual); C-HSM and C-NGMM do not read it
temporal_resolution = "default"

# Temporal resolution (annual).  C-HSM runs every year from 2023 to 2050 and reports these years
aggregate_years=false
aggregate_start_year = 2023
summary_years = [2025, 2030, 2035, 2040, 2045, 2050]

strict_validation=false

[natural_gas]
input_path = 'input/natural_gas'

[hsm]
input_path = 'input/hsm'
# C-NGMM's inputs, for the supply regions and cost tier capacities
ng_input_path = 'input/natural_gas'
# the first iteration's Henry Hub path, 1987 USD/MMBtu
henry_hub_file = 'henry_hub_path_aeo2026_1987usd.csv'
# the reference path a coupled run scales by C-NGMM's hub price over the reference price, and the
# dollar year of its hh_<year>usd_per_mmbtu column, which must equal PRICE_DOLLAR_YEAR in
# src/models/natural_gas/constants.py
coupling_reference_file = 'henry_hub_path_aeo2026_1987usd.csv'
coupling_reference_dollar_year = 2025
