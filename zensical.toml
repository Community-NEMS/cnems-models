[project]
site_name = "C-NEMS Models"
site_description = "Documentation for the C-NEMS family of energy models."
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/Community-NEMS/cnems-models"
repo_name = "Community-NEMS/cnems-models"
watch = ["src"]

nav = [
  { "Home" = "index.md" },
  { "Models" = [
    { "Electricity" = "models/electricity.md" },
    { "Natural Gas" = "models/natural_gas.md" },
    { "Magic" = "models/magic.md" },
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
  "content.code.annotate",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
