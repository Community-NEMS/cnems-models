# Schema metadata describing the parameter-source CSV files consumed by
# data_ingestor.py's load_param_data()/load_dataframes(). This is fixed, developer-owned
# metadata (not a per-run configuration) -- do not confuse with run_configs/*.toml, which
# holds user-facing run settings.
#
# Column ordering in index_cols matters: it drives MultiIndex construction in
# convert_to_df() and downstream column-order expectations in the model.
#
# required = true  -> loaded/used regardless of ElecConfig switches
# required = false -> only used when a specific ElecConfig switch is enabled (see comment
#                      per entry); note load_param_data still loads every file
#                      unconditionally today -- required is metadata only for now.
#
# Units are carried in each value_col name (MW, MWh, USD, frac, hr).  The model works in these
# units directly; no scaling is applied on load.

[[param_source]]
key = "storage_efficiency"
filename = "storage_efficiency.csv"
index_cols = ["tech"]
value_col = "storage_efficiency_frac"
required = true

[[param_source]]
key = "capital_cost"
filename = "capital_cost.csv"
index_cols = ["region", "tech", "step", "year"]
value_col = "capital_cost_usd_per_mw"
required = false  # capacity_expansion

[[param_source]]
key = "capital_cost_initial"
filename = "capital_cost_initial.csv"
index_cols = ["region", "tech", "step"]
value_col = "capital_cost_initial_usd_per_mw"
required = false  # capacity_expansion + expansion_learning_type != DISABLED

[[param_source]]
key = "capacity_factor_vre"
filename = "capacity_factor_vre.csv"
index_cols = ["region", "tech", "step", "hour"]
value_col = "capacity_factor_vre_frac"
required = true

[[param_source]]
key = "fom_cost"
filename = "fom_cost.csv"
index_cols = ["region", "tech", "step"]
value_col = "fom_cost_usd_per_mw_yr"
required = true

[[param_source]]
key = "storage_duration"
filename = "storage_duration.csv"
index_cols = ["tech"]
value_col = "storage_duration_hr"
required = true

[[param_source]]
key = "hydro_capacity_factor"
filename = "hydro_capacity_factor.csv"
index_cols = ["region", "season"]
value_col = "hydro_capacity_factor_frac"
required = true

[[param_source]]
key = "learning_rate"
filename = "learning_rate.csv"
index_cols = ["tech"]
value_col = "learning_exponent"
required = false  # capacity_expansion + expansion_learning_type != DISABLED

[[param_source]]
key = "ramp_down_cost"
filename = "ramp_down_cost.csv"
index_cols = ["tech"]
value_col = "ramp_down_cost_usd_per_mwh"
required = false  # ramping_required

[[param_source]]
key = "ramp_rate"
filename = "ramp_rate.csv"
index_cols = ["tech"]
value_col = "ramp_rate_frac_per_hr"
required = false  # ramping_required

[[param_source]]
key = "ramp_up_cost"
filename = "ramp_up_cost.csv"
index_cols = ["tech"]
value_col = "ramp_up_cost_usd_per_mwh"
required = false  # ramping_required

[[param_source]]
# reserve_type values here and in reserve_tech_limit must be ReserveType members (elec_config.py)
key = "reserve_cost"
filename = "reserve_cost.csv"
